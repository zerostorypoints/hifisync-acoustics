# Two-channel measurement node: ESP32-S3 with 8 MB octal PSRAM and two IM73D122 PDM microphones
# on one PDM bus (shared CLOCK and DATA; one mic has L/R to GND, the other to 3.3 V). It
# long-polls the engine for a record command, records 48 kHz/16-bit stereo into PSRAM and uploads
# a 2-channel WAV. docs/node-firmware.md, "Stereo (two microphones on one bus)", describes it.
# Compile check: cp secrets.example.yaml secrets.yaml && esphome compile capture-node-stereo.yaml

esphome:
  name: node-b
  min_version: 2026.9.0

esp32:
  variant: esp32s3
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG
  hardware_uart: UART0   # the COM port of the DevKitC-1 clone; USB_CDC is the other USB-C port

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: local
      path: ../components
    components: [acoustics_capture]

# ---- Microphones: 2 x IM73D122, PDM, one bus ----
# PDM clock on the LRCLK (WS) pin, data on DIN, both shared by the two mics. 48 kHz with the
# default pdm_dsr 8 gives a 64 x 48 kHz = 3.072 MHz clock. Each mic drives DATA on its own clock
# edge, selected by its L/R pin; channel: stereo reads both into interleaved frames.
i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: GPIO4   # -> CLK of both mics

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_bus
    adc_type: external
    pdm: true
    i2s_din_pin: GPIO5     # <- DATA of both mics
    sample_rate: 48000
    bits_per_sample: 16bit
    channel: stereo
    # ESPHome 2026.9.1 runs one DC filter over the interleaved samples, which mixes the two
    # channels; keep it off for stereo.
    correct_dc_offset: false

# Not passive: it starts the microphone and keeps it running, so the passive capture source
# receives audio whenever a command arrives. It measures channel 0 only.
sensor:
  - platform: sound_level
    microphone:
      microphone: mic
      channels: [0]
    passive: false
    measurement_duration: 1s
    rms:
      name: Sound level

acoustics_capture:
  id: capture
  microphone:
    microphone: mic
    channels: [0, 1]       # both mics, interleaved in the uploaded WAV
  engine_url: http://192.0.2.10:8765
  node_id: node-b
  token: !secret acoustics_node_token
  max_capture: 40s         # 40 s x 192 000 B/s = 7.68 MB of the 8 MB PSRAM
  poll_wait: 25s
  state:
    name: Capture state
