name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv run pytest -q

  esphome-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            esphome/examples/.esphome
          key: esphome-2026.9.1-${{ hashFiles('esphome/examples/capture-node.yaml') }}
          restore-keys: esphome-2026.9.1-
      - run: cp esphome/examples/secrets.example.yaml esphome/examples/secrets.yaml
      - run: uvx esphome@2026.9.1 compile esphome/examples/capture-node.yaml
